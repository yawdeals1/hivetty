[workspace]
resolver = "2"
members = ["crates/hivetty-core", "crates/hivetty-cli", "crates/hivetty-host", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
vte = "0.15"
tokio = { version = "1", features = ["full"] }
